<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人简历</title>
 
</head>
<body>
    <!-- 基础信息：使用id精准定位 -->
    <h2 id="name">张三</h2>

    <!-- 联系信息：使用class分类 -->
    <div class="contact">电话：13800138000</div>
    <div class="contact">邮箱：<span>zhangsan@xxx.com</span></div>

    <!-- 个人属性：使用标签+class -->
    <p class="info">性别：男</p>
    <p class="info">年龄：24</p>

    <hr>

    <!-- 教育经历：表格结构（爬虫必练） -->
    <h3>教育经历</h3>
    <table id="education">
        <tr>
            <th>学校</th>
            <th>专业</th>
            <th>时间</th>
        </tr>
        <tr>
            <td>XX大学</td>
            <td>计算机科学与技术</td>
            <td>2020-2024</td>
        </tr>
    </table>

    <!-- 项目经历：带id的区块 -->
    <h3>项目经历</h3>
    <div id="project">
        <p>项目名称：校园图书管理系统</p>
        <p>技术栈：Python、MySQL、HTML</p>
        <p>职责：负责后端接口开发与数据爬取模块</p>
    </div>
</body>
</html>
